<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .logo {
      font-size: 1.5rem;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }
    .description {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 18px;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .status {
      font-size: 0.8rem;
      color: #22c55e;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🚀</span>
    <h1 class="title">Resume Scraper</h1>
  </div>
  <p class="description">
    Click the button below to scrape the job details from the current page and open them in the AI Resume Analyzer app.
  </p>
  <button id="scrape-btn" class="btn">
    ⚡ Analyze Job Posting
  </button>
  <div id="status" class="status">Launching Analyzer App...</div>
  <script src="popup.js"></script>
</body>
</html>
